name: Manka weboldal - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: manka-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Forraskod letoltese
        uses: actions/checkout@v4
      - name: GitHub Pages konfiguralasa
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Oldal csomagolasa
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      - name: Publikalas
        id: deployment
        uses: actions/deploy-pages@v4
